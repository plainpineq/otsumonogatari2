{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 70vh;">
    <div class="card auth-card p-4">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">ログイン</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                </div>
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        ログインに失敗しました。メールアドレスとパスワードを確認してください。
                    </div>
                {% endif %}
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">ログイン</button>
                </div>
            </form>
            <hr>
            <div class="text-center">
                <a href="{% url 'register' %}">新規登録はこちら</a>
            </div>
            <div class="text-center mt-2">
                <a href="{% url 'usage' %}" target="_blank">使い方はこちら（ヘルプ）</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
